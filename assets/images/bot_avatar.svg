
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4E4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A80000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M 50,10 C 40,10 40,20 40,20 C 40,30 45,35 50,40 C 55,35 60,30 60,20 C 60,20 60,10 50,10 z" fill="url(#botGradient)" />
    <path d="M 40,45 C 35,50 30,60 30,70 L 70,70 C 70,60 65,50 60,45 C 55,50 45,50 40,45 z" fill="url(#botGradient)" />
    <rect x="25" y="70" width="50" height="10" rx="5" fill="url(#botGradient)" />
    <rect x="20" y="80" width="60" height="10" rx="5" fill="url(#botGradient)" />
  </g>
</svg>
